<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Planeta</title>
  <!-- fonte do nome e da versão: Orbitron, quadradona (cara de tela de scouter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600&display=swap">
  <!-- ?v=versão: cada versão tem um endereço novo, então o navegador não
       mistura a página nova com o estilo/jogo antigos guardados no cache.
       Mudou a VERSAO no jogo.js? Muda aqui também (nos dois). -->
  <link rel="stylesheet" href="estilo.css?v=2.1.0">
</head>
<body>
  <canvas id="tela"></canvas>
  <!-- risquinhos de velocidade (estilo anime) quando dá dash -->
  <canvas id="riscos" class="riscos" aria-hidden="true"></canvas>

  <!-- debaixo d'água: tudo puxado pro verde, e bolhinhas na frente -->
  <div class="debaixo" id="debaixo" aria-hidden="true"></div>

  <!-- céu escuro (as 7 esferas): clarão dos raios -->
  <div class="clarao" id="clarao" aria-hidden="true"></div>

  <!-- fôlego debaixo d'água: a barra azul vai diminuindo -->
  <div class="ar" id="ar" aria-label="fôlego"><div class="ar-nivel" id="arNivel"></div></div>

  <!-- acabou o ar: escurece e volta pro começo -->
  <div class="apagao" id="apagao" aria-hidden="true"></div>

  <div class="mira"></div>

  <div class="creditos"><a class="autor" href="https://github.com/jesielt" target="_blank" rel="noopener">© Jesiel Ternero</a><span class="versao" id="versao"></span></div>

  <!-- radar: o mapa visto de cima, girando junto com você -->
  <canvas class="radar" id="radar" aria-hidden="true"></canvas>

  <!-- caixinha das esferas capturadas: uma casa pra cada número de estrelas -->
  <div class="caixa-esferas" id="caixaEsferas" aria-label="esferas capturadas">
    <div class="casa" data-n="1"><span class="bola">1</span></div>
    <div class="casa" data-n="2"><span class="bola">2</span></div>
    <div class="casa" data-n="3"><span class="bola">3</span></div>
    <div class="casa" data-n="4"><span class="bola">4</span></div>
    <div class="casa" data-n="5"><span class="bola">5</span></div>
    <div class="casa" data-n="6"><span class="bola">6</span></div>
    <div class="casa" data-n="7"><span class="bola">7</span></div>
  </div>

  <!-- aparece em cima da esfera quando dá pra capturar: clique direito -->
  <div class="capturar" id="capturar" aria-label="capturar: botão direito do mouse">
    <svg viewBox="0 0 26 36" aria-hidden="true">
      <path class="apertar" d="M13 1.5 C19.4 1.5 24.5 6.6 24.5 13 V14 H13 Z" />
      <rect x="1.5" y="1.5" width="23" height="33" rx="11.5" fill="none" stroke="currentColor" stroke-width="2.2" />
      <path d="M1.5 14 H24.5 M13 1.5 V14" fill="none" stroke="currentColor" stroke-width="2.2" />
    </svg>
  </div>

  <!-- altura acima do mar, com o "m" no alfabeto saiyajin -->
  <div class="altura" aria-label="altura">
    <span id="alturaNum">0</span>
    <svg class="m-saiyajin" viewBox="0 0 28 31" aria-hidden="true">
      <path d="M0 1.5 Q0 0 1.5 0 H26.5 Q28 0 28 1.5 V16 H19.5 L18.5 10 H10 L9 16 H0 Z" />
      <rect x="0" y="21" width="28" height="10" rx="1.5" />
    </svg>
  </div>
  <!-- velocidade (km/h na escala que você sente), com o "V" saiyajin:
       barra da esquerda reta; a da direita com o canto de cima-esquerdo arredondado -->
  <div class="velocidade" aria-label="velocidade">
    <span id="velNum">0</span>
    <svg class="v-saiyajin" viewBox="0 0 28 25" aria-hidden="true">
      <path d="M0.3 0 H8.8 L9.1 25 H0 Z" />
      <path d="M22.6 0 H28 V25 H18.8 V3.8 Q18.8 0 22.6 0 Z" />
    </svg>
  </div>
  <div class="convite" id="convite">clique pra voar</div>

  <!-- Painel no canto: acende o que está sendo apertado.
       As teclas também dá pra clicar/tocar. -->
  <div class="teclas" aria-hidden="true">
    <div class="grupo">
      <span class="tecla vazia"></span>
      <span class="tecla" data-tecla="KeyW">W</span>
      <span class="tecla perigo" data-tecla="KeyR" title="R: recomeçar do início (perde as esferas)">R<svg class="caveira" viewBox="0 0 16 16" aria-hidden="true">
          <path fill="currentColor" d="M8 1.6C4.5 1.6 2.1 4 2.1 7.2c0 1.8.8 3.1 2.1 3.8V13c0 .6.4 1 1 1h5.6c.6 0 1-.4 1-1v-2c1.3-.7 2.1-2 2.1-3.8C13.9 4 11.5 1.6 8 1.6z" />
          <circle cx="5.7" cy="7.5" r="1.6" fill="#fff" />
          <circle cx="10.3" cy="7.5" r="1.6" fill="#fff" />
          <path d="M8 9.4 7.1 11h1.8z" fill="#fff" />
          <path d="M6.5 12.1v1.9M8 12.1v1.9M9.5 12.1v1.9" stroke="#fff" stroke-width=".8" />
        </svg></span>
      <span class="tecla" data-tecla="KeyA">A</span>
      <span class="tecla" data-tecla="KeyS">S</span>
      <span class="tecla" data-tecla="KeyD">D</span>
    </div>
    <div class="grupo">
      <span class="tecla vazia"></span>
      <span class="tecla" data-tecla="ArrowUp">↑</span>
      <span class="tecla vazia"></span>
      <span class="tecla" data-tecla="ArrowLeft">←</span>
      <span class="tecla" data-tecla="ArrowDown">↓</span>
      <span class="tecla" data-tecla="ArrowRight">→</span>
    </div>
    <div class="mouse" id="mouse">
      <span class="botao esq" id="mouseEsq"></span>
      <span class="botao dir" id="mouseDir"></span>
    </div>
    <div class="base">
      <span class="tecla shift" data-tecla="ShiftLeft">⇧</span>
      <span class="tecla espaco" data-tecla="Space"></span>
      <span class="tecla" data-tecla="KeyC">C</span>
    </div>
    <!-- não mergulhar: (botão direito) ×2 liga/desliga; o nadador com X aceso = ligado -->
    <div class="mergulho" id="semMergulho" role="switch" aria-checked="false" aria-label="não mergulhar">
      <svg class="mouse-dir" viewBox="0 0 26 36" aria-hidden="true">
        <path d="M13 1.5 C19.4 1.5 24.5 6.6 24.5 13 V14 H13 Z" fill="currentColor" />
        <rect x="1.5" y="1.5" width="23" height="33" rx="11.5" fill="none" stroke="currentColor" stroke-width="2.4" />
        <path d="M1.5 14 H24.5 M13 1.5 V14" fill="none" stroke="currentColor" stroke-width="2.4" />
      </svg>
      <span class="vezes">×2</span>
      <span class="interruptor">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18.6" cy="11" r="2.7" fill="currentColor" stroke="none" />
          <path d="M4.5 15.2 L14.5 12.4" stroke-width="3.6" />
          <path d="M13.2 12.4 L15.6 6.2 L21.2 5.4" stroke-width="2.6" />
          <path d="M2 19.6 q2.5 -2 5 0 t5 0 t5 0 t5 0" stroke-width="2.6" />
          <path class="x" d="M3 3 L8 8 M8 3 L3 8" />
        </svg>
      </span>
    </div>
  </div>

  <!-- Celular: joystick (aparece onde o dedão encosta, do lado esquerdo) e
       botões grandes do lado direito. No computador ficam escondidos. -->
  <div class="joystick" id="joystick" aria-hidden="true"><span class="joy-bola"></span></div>
  <div class="toque-botoes">
    <span class="tbotao pequeno perigo" id="toqueRecomecar" aria-label="recomeçar do início"><svg class="caveira-toque" viewBox="0 0 16 16" aria-hidden="true">
          <path fill="currentColor" d="M8 1.6C4.5 1.6 2.1 4 2.1 7.2c0 1.8.8 3.1 2.1 3.8V13c0 .6.4 1 1 1h5.6c.6 0 1-.4 1-1v-2c1.3-.7 2.1-2 2.1-3.8C13.9 4 11.5 1.6 8 1.6z" />
          <circle cx="5.7" cy="7.5" r="1.6" fill="#fff" />
          <circle cx="10.3" cy="7.5" r="1.6" fill="#fff" />
          <path d="M8 9.4 7.1 11h1.8z" fill="#fff" />
          <path d="M6.5 12.1v1.9M8 12.1v1.9M9.5 12.1v1.9" stroke="#fff" stroke-width=".8" />
        </svg></span>
    <span class="tbotao pequeno" id="toqueMergulho" role="switch" aria-label="não mergulhar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18.6" cy="11" r="2.7" fill="currentColor" stroke="none" />
        <path d="M4.5 15.2 L14.5 12.4" stroke-width="3.6" />
        <path d="M13.2 12.4 L15.6 6.2 L21.2 5.4" stroke-width="2.6" />
        <path d="M2 19.6 q2.5 -2 5 0 t5 0 t5 0 t5 0" stroke-width="2.6" />
        <path class="x" d="M3 3 L8 8 M8 3 L3 8" />
      </svg>
    </span>
    <span class="tbotao" data-tecla="Space" aria-label="subir">▲</span>
    <span class="tbotao" id="toqueDash" aria-label="dash (liga/desliga)">⚡</span>
    <span class="tbotao" data-tecla="KeyC" aria-label="descer">▼</span>
  </div>
  <div class="gire" aria-hidden="true">vire o celular de lado</div>

  <script src="jogo.js?v=2.1.0"></script>
</body>
</html>
